<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>讀書重點</title>
  <meta name="theme-color" content="#FFFFFF">
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; background-color: #FFFFFF; color: #111111; }
    .pb-safe { padding-bottom: calc(6rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="min-h-screen pb-safe select-none bg-[#FFFFFF]">

  <!-- Header -->
  <header class="sticky top-0 bg-white/90 backdrop-blur-md z-10 px-6 pt-8 pb-4">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 id="page-title" class="text-2xl font-black tracking-tight text-[#111111]">Library</h1>
      <div class="w-2.5 h-2.5 rounded-full bg-[#7C3AED]"></div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-6 pt-2">
    
    <!-- 頁面 1: 書庫 (點擊書名展開重點) -->
    <div id="view-books" class="space-y-3">
      <div id="books-list" class="space-y-3">
        <p class="text-center text-gray-400 py-10 font-semibold text-sm">載入中...</p>
      </div>
    </div>

    <!-- 頁面 2: 主題 (僅預覽與條列重點，不顯示心得) -->
    <div id="view-categories" class="space-y-6 hidden">
      <div id="categories-list" class="space-y-6">
        <p class="text-center text-gray-400 py-10 font-semibold text-sm">載入中...</p>
      </div>
    </div>

    <!-- 頁面 3: 新增/編輯完整頁面 -->
    <div id="view-add" class="hidden space-y-6 pb-8">
      <form id="note-form" class="space-y-5">
        <input type="hidden" id="note-id">

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Book</label>
          <input type="text" id="book_title" list="book-list" required class="w-full bg-[#F6F6F6] text-[#111111] p-4 rounded-2xl border-0 focus:ring-2 focus:ring-[#7C3AED] focus:outline-none text-base font-bold">
          <datalist id="book-list"></datalist>
        </div>

        <div>
          <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-2">Topic</label>
          <input type="text" id="category" list="category-list" required class="w-full bg-[#F6F6F6] text-[#111111] p-4 rounded-2xl border-0 focus:ring-2 focus:ring-[#7C3AED] focus:outline-none text-base font-bold">
          <datalist id="category-list"></datalist>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Key Point</label>
            <button type="button" onclick="startSpeech('quote')" class="text-xs font-bold text-[#7C3AED] bg-[#7C3AED]/10 px-3 py-1 rounded-full">
              Voice
            </button>
          </div>
          <textarea id="quote" required rows="5" class="w-full bg-[#F6F6F6] text-[#111111] p-4 rounded-2xl border-0 focus:ring-2 focus:ring-[#7C3AED] focus:outline-none text-base font-medium leading-relaxed"></textarea>
        </div>

        <div>
          <div class="flex justify-between items-center mb-2">
            <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider">Note</label>
            <button type="button" onclick="startSpeech('thought')" class="text-xs font-bold text-[#7C3AED] bg-[#7C3AED]/10 px-3 py-1 rounded-full">
              Voice
            </button>
          </div>
          <textarea id="thought" rows="3" class="w-full bg-[#F6F6F6] text-[#111111] p-4 rounded-2xl border-0 focus:ring-2 focus:ring-[#7C3AED] focus:outline-none text-base font-medium leading-relaxed"></textarea>
        </div>

        <div class="flex gap-3 pt-2">
          <button type="button" onclick="switchTab('books')" class="w-1/3 bg-[#F6F6F6] text-gray-600 font-bold py-4 rounded-2xl text-base">Cancel</button>
          <button type="submit" id="submit-btn" class="w-2/3 bg-[#111111] text-white font-bold py-4 rounded-2xl text-base">Save</button>
        </div>
      </form>
    </div>

  </main>

  <!-- Bottom Nav -->
  <nav class="fixed bottom-6 left-6 right-6 bg-[#111111] text-white rounded-full z-40 p-2 shadow-2xl">
    <div class="max-w-md mx-auto flex justify-between items-center px-4">
      <button onclick="switchTab('books')" id="nav-books" class="px-5 py-3 font-bold text-sm text-white transition-opacity">
        Library
      </button>

      <button onclick="switchTab('add')" id="nav-add" class="w-11 h-11 bg-[#7C3AED] text-white rounded-full flex items-center justify-center font-bold text-xl active:scale-95 transition-transform">
        +
      </button>

      <button onclick="switchTab('categories')" id="nav-categories" class="px-5 py-3 font-bold text-sm text-gray-400 transition-opacity">
        Topics
      </button>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://uumglpeoqmkplcnccfrq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_63y7i9dorGmGi34pP6rCRQ_5xuUo1r_';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allNotes = [];
    let currentTab = 'books';
    let openBooks = {};
    let expandedCategories = {};

    async function fetchNotes() {
      const { data, error } = await supabaseClient.from('book_notes').select('*').order('created_at', { ascending: false });
      if (error) return;
      allNotes = data;
      updateDatalists();
      renderCurrentView();
    }

    function updateDatalists() {
      const books = [...new Set(allNotes.map(n => n.book_title).filter(Boolean))];
      const categories = [...new Set(allNotes.map(n => n.category).filter(Boolean))];
      document.getElementById('book-list').innerHTML = books.map(b => `<option value="${b}">`).join('');
      document.getElementById('category-list').innerHTML = categories.map(c => `<option value="${c}">`).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const title = document.getElementById('page-title');
      const navBooks = document.getElementById('nav-books');
      const navCat = document.getElementById('nav-categories');

      document.getElementById('view-books').classList.add('hidden');
      document.getElementById('view-categories').classList.add('hidden');
      document.getElementById('view-add').classList.add('hidden');

      navBooks.className = "px-5 py-3 font-bold text-sm text-gray-400";
      navCat.className = "px-5 py-3 font-bold text-sm text-gray-400";

      if (tab === 'books') {
        title.innerText = "Library";
        navBooks.className = "px-5 py-3 font-bold text-sm text-white";
        document.getElementById('view-books').classList.remove('hidden');
      } else if (tab === 'categories') {
        title.innerText = "Topics";
        navCat.className = "px-5 py-3 font-bold text-sm text-white";
        document.getElementById('view-categories').classList.remove('hidden');
      } else if (tab === 'add') {
        title.innerText = "New Point";
        resetForm();
        document.getElementById('view-add').classList.remove('hidden');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentTab === 'books') renderBooksView();
      else if (currentTab === 'categories') renderCategoriesView();
    }

    // 1. 書庫：純書名列表，點擊展開下方所有重點
    function renderBooksView() {
      const container = document.getElementById('books-list');
      const booksMap = {};

      allNotes.forEach(n => {
        const title = n.book_title || 'Untitled';
        if (!booksMap[title]) booksMap[title] = [];
        booksMap[title].push(n);
      });

      const bookNames = Object.keys(booksMap);
      if (bookNames.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-12 font-medium">No books found</p>`;
        return;
      }

      container.innerHTML = bookNames.map(book => {
        const isOpen = openBooks[book];
        const notes = booksMap[book];

        return `
          <div class="bg-[#F6F6F6] rounded-3xl p-5 space-y-3 transition-all">
            <div onclick="toggleBook('${book}')" class="flex justify-between items-center cursor-pointer">
              <h2 class="text-lg font-black text-[#111111]">${book}</h2>
              <span class="text-xs font-bold text-gray-400">${isOpen ? '▲' : '▼'}</span>
            </div>

            ${isOpen ? `
              <div class="space-y-3 pt-2 border-t border-gray-200">
                ${notes.map(note => renderBookDetailCard(note)).join('')}
              </div>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleBook(book) {
      openBooks[book] = !openBooks[book];
      renderBooksView();
    }

    function renderBookDetailCard(note) {
      const paragraphs = note.quote.split('\n').filter(line => line.trim() !== '');
      const quotesHtml = paragraphs.map(p => `
        <li class="flex items-start gap-2.5 mb-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#7C3AED] mt-2 shrink-0"></span>
          <span class="text-sm font-medium text-[#111111] leading-relaxed">${p}</span>
        </li>
      `).join('');

      return `
        <div class="bg-white p-4 rounded-2xl space-y-2">
          <ul class="pl-1">${quotesHtml}</ul>
          ${note.thought ? `<p class="text-xs text-gray-500 font-medium bg-[#F6F6F6] p-2.5 rounded-xl mt-2">${note.thought}</p>` : ''}
          <div class="flex justify-end gap-3 pt-1">
            <button onclick="editNote(${note.id})" class="text-xs font-bold text-gray-400">Edit</button>
            <button onclick="deleteNote(${note.id})" class="text-xs font-bold text-red-400">Delete</button>
          </div>
        </div>
      `;
    }

    // 2. 主題列表：主題大標題 + 前三條重點（不包含心得）
    function renderCategoriesView() {
      const container = document.getElementById('categories-list');
      const catMap = {};

      allNotes.forEach(n => {
        const cat = n.category || 'General';
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(n);
      });

      const categories = Object.keys(catMap);
      if (categories.length === 0) {
        container.innerHTML = `<p class="text-center text-gray-400 py-12 font-medium">No topics found</p>`;
        return;
      }

      container.innerHTML = categories.map(cat => {
        const notes = catMap[cat];
        const isExpanded = expandedCategories[cat];
        const displayNotes = isExpanded ? notes : notes.slice(0, 3);
        const hasMore = notes.length > 3;

        return `
          <div class="space-y-3">
            <h2 class="text-xl font-black tracking-tight text-[#111111] px-1">${cat}</h2>
            <div class="space-y-3">
              ${displayNotes.map(note => renderCategoryPointCard(note)).join('')}
            </div>
            ${hasMore ? `
              <button onclick="toggleCategory('${cat}')" class="text-xs font-bold text-[#7C3AED] px-1 pt-1">
                ${isExpanded ? 'Show less' : `+ ${notes.length - 3} more`}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleCategory(cat) {
      expandedCategories[cat] = !expandedCategories[cat];
      renderCategoriesView();
    }

    // 主題頁專用重點卡片（明確隱藏心得）
    function renderCategoryPointCard(note) {
      const paragraphs = note.quote.split('\n').filter(line => line.trim() !== '');
      const quotesHtml = paragraphs.map(p => `
        <li class="flex items-start gap-2.5 mb-1.5">
          <span class="w-1.5 h-1.5 rounded-full bg-[#111111] mt-2 shrink-0"></span>
          <span class="text-sm font-medium text-[#111111] leading-relaxed">${p}</span>
        </li>
      `).join('');

      return `
        <div class="bg-[#F6F6F6] p-4 rounded-2xl space-y-2">
          <p class="text-xs font-bold text-gray-400">${note.book_title}</p>
          <ul class="pl-1">${quotesHtml}</ul>
          <div class="flex justify-end gap-3 pt-1">
            <button onclick="editNote(${note.id})" class="text-xs font-bold text-gray-400">Edit</button>
            <button onclick="deleteNote(${note.id})" class="text-xs font-bold text-red-400">Delete</button>
          </div>
        </div>
      `;
    }

    function resetForm() {
      document.getElementById('note-id').value = '';
      document.getElementById('note-form').reset();
      document.getElementById('submit-btn').innerText = "Save";
    }

    function editNote(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      document.getElementById('note-id').value = note.id;
      document.getElementById('book_title').value = note.book_title;
      document.getElementById('category').value = note.category || '';
      document.getElementById('quote').value = note.quote;
      document.getElementById('thought').value = note.thought || '';

      document.getElementById('submit-btn').innerText = "Update";
      switchTab('add');
    }

    function startSpeech(targetId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("Speech recognition not supported");
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.onstart = () => {};
      recognition.onresult = (e) => {
        const val = document.getElementById(targetId).value;
        document.getElementById(targetId).value = val ? val + '\n' + e.results[0][0].transcript : e.results[0][0].transcript;
      };
      recognition.start();
    }

    document.getElementById('note-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerText = 'Saving...'; btn.disabled = true;

      const noteId = document.getElementById('note-id').value;
      const payload = {
        book_title: document.getElementById('book_title').value,
        category: document.getElementById('category').value || 'General',
        quote: document.getElementById('quote').value,
        thought: document.getElementById('thought').value
      };

      let error;
      if (noteId) {
        const res = await supabaseClient.from('book_notes').update(payload).eq('id', noteId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('book_notes').insert([payload]);
        error = res.error;
      }

      if (error) alert('Error: ' + error.message);
      else { 
        fetchNotes();
        switchTab('books');
      }
      btn.disabled = false;
    });

    async function deleteNote(id) {
      if (confirm('Delete this point?')) {
        const { error } = await supabaseClient.from('book_notes').delete().eq('id', id);
        if (!error) fetchNotes();
      }
    }

    fetchNotes();
  </script>
</body>
</html>
