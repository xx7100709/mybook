<script>
  const SUPABASE_URL = 'https://uumglpeoqmkplcnccfrq.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_63y7i9dorGmGi34pP6rCRQ_5xuUo1r_';
  const supabaseClient = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;

  let allNotes = [];
  let currentTab = 'add';
  let activeBook = null;
  let activeCategory = null;
  let selectedCategoryFilter = 'ALL';
  let categorySortMode = 'time';

  let loadedImage = null;
  const canvas = document.getElementById('doodle-canvas');
  const ctx = canvas.getContext('2d');
  let isDrawing = false;
  let scaleRatio = 1;

  let maskMinX = Infinity, maskMinY = Infinity, maskMaxX = -Infinity, maskMaxY = -Infinity;

  // 強力清理 HTML 與隱藏標籤
  function cleanHtmlContent(html) {
    if (!html) return '';
    // 移除所有 HTML 標籤
    let textOnly = html.replace(/<[^>]*>/g, '');
    // 移除常見的 HTML 轉義空白與標準空白
    textOnly = textOnly.replace(/&nbsp;/gi, '').replace(/\s+/g, '').trim();
    // 如果完全沒有任何實際文字，直接回傳 null (給 Supabase 存成 NULL)
    return textOnly.length === 0 ? null : html.trim();
  }

  function initAppStateFromHash() {
    const hash = location.hash.replace('#', '');
    if (hash) {
      const parts = hash.split('/');
      currentTab = parts[0] || 'add';
      if (parts[0] === 'book' && parts[1]) activeBook = decodeURIComponent(parts[1]);
      if (parts[0] === 'category' && parts[1]) activeCategory = decodeURIComponent(parts[1]);
    } else {
      currentTab = 'add';
    }
  }

  function updateHash() {
    if (activeBook) {
      location.hash = `book/${encodeURIComponent(activeBook)}`;
    } else if (activeCategory) {
      location.hash = `category/${encodeURIComponent(activeCategory)}`;
    } else {
      location.hash = currentTab;
    }
  }

  window.addEventListener('popstate', () => {
    initAppStateFromHash();
    renderCurrentView();
  });

  async function fetchNotes() {
    if (!supabaseClient) return;
    const { data, error } = await supabaseClient.from('book_notes').select('*').order('created_at', { ascending: false });
    if (error) {
      console.error(error);
      return;
    }
    allNotes = data || [];
    updateDatalists();
    updateCategoryDropdown();
    renderCurrentView();
  }

  function updateDatalists() {
    const books = [...new Set(allNotes.map(n => n.book_title).filter(Boolean))];
    const categories = [...new Set(allNotes.map(n => n.category).filter(Boolean))];
    document.getElementById('book-list').innerHTML = books.map(b => `<option value="${b}">`).join('');
    document.getElementById('category-list').innerHTML = categories.map(c => `<option value="${c}">`).join('');
  }

  function updateCategoryDropdown() {
    const select = document.getElementById('category-filter');
    const categories = [...new Set(allNotes.map(n => n.category || '未分類'))];
    select.innerHTML = `<option value="ALL">全部主題</option>` + categories.map(c => `<option value="${c}">${c}</option>`).join('');
    select.value = selectedCategoryFilter;
  }

  function switchTab(tab) {
    currentTab = tab;
    activeBook = null;
    activeCategory = null;
    updateHash();
    renderCurrentView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function openAddNew(defaultBookTitle = '') {
    resetForm();
    if (defaultBookTitle) {
      document.getElementById('book_title').value = defaultBookTitle;
    }
    switchTab('add');
  }

  function goBack() {
    if (activeBook) {
      activeBook = null;
      switchTab('books');
    } else if (activeCategory) {
      activeCategory = null;
      switchTab('categories');
    } else {
      switchTab('add');
    }
  }

  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderCurrentView() {
    const title = document.getElementById('page-title');
    const backBtn = document.getElementById('back-btn');
    const navBooks = document.getElementById('nav-books');
    const navCat = document.getElementById('nav-categories');

    const views = ['view-books', 'view-book-detail', 'view-categories', 'view-category-detail', 'view-add'];
    views.forEach(v => document.getElementById(v).classList.add('hidden'));

    navBooks.className = "flex-1 flex items-center justify-center text-center font-medium text-sm text-gray-400";
    navCat.className = "flex-1 flex items-center justify-center text-center font-medium text-sm text-gray-400";
    backBtn.classList.add('hidden');

    if (activeBook) {
      title.innerText = activeBook;
      backBtn.classList.remove('hidden');
      document.getElementById('view-book-detail').classList.remove('hidden');
      renderBookDetailView();
    } else if (activeCategory) {
      title.innerText = activeCategory;
      backBtn.classList.remove('hidden');
      document.getElementById('view-category-detail').classList.remove('hidden');
      renderCategoryDetailView();
    } else if (currentTab === 'books') {
      title.innerText = "Library";
      navBooks.className = "flex-1 flex items-center justify-center text-center font-medium text-sm text-white";
      document.getElementById('view-books').classList.remove('hidden');
      renderBooksView();
    } else if (currentTab === 'categories') {
      title.innerText = "Topics";
      navCat.className = "flex-1 flex items-center justify-center text-center font-medium text-sm text-white";
      document.getElementById('view-categories').classList.remove('hidden');
      renderCategoriesView();
    } else if (currentTab === 'add') {
      title.innerText = document.getElementById('note-id').value ? "編輯重點" : "新增重點";
      document.getElementById('view-add').classList.remove('hidden');
    }
  }

  function renderBooksView() {
    const container = document.getElementById('books-list');
    const bookNames = [...new Set(allNotes.map(n => n.book_title).filter(Boolean))];

    if (bookNames.length === 0) {
      container.innerHTML = `<p class="text-center text-gray-400 py-12 font-medium text-base">尚未新增任何書籍</p>`;
      return;
    }

    container.innerHTML = bookNames.map(book => `
      <div class="bg-[#F6F6F6] rounded-2xl p-5 flex justify-between items-center">
        <h2 onclick="openBookDetail('${book}')" class="text-lg font-medium text-[#111111] flex-1 cursor-pointer">${book}</h2>
        <div class="flex items-center gap-3">
          <button onclick="openAddNew('${book}')" title="為這本書新增重點" class="w-8 h-8 rounded-full bg-[#7C3AED]/10 text-[#7C3AED] font-medium flex items-center justify-center text-lg active:scale-90 transition">+</button>
          <span onclick="openBookDetail('${book}')" class="text-gray-400 font-medium text-lg cursor-pointer">→</span>
        </div>
      </div>
    `).join('');
  }

  function openBookDetail(book) {
    activeBook = book;
    updateHash();
    renderCurrentView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderBookDetailView() {
    const container = document.getElementById('book-detail-list');
    const notes = allNotes.filter(n => n.book_title === activeBook);
    container.innerHTML = notes.map(note => renderFullCard(note)).join('');
  }

  function filterCategory(cat) {
    selectedCategoryFilter = cat;
    renderCategoriesView();
  }

  function toggleCategorySort() {
    categorySortMode = categorySortMode === 'time' ? 'name' : 'time';
    document.getElementById('sort-label').innerText = categorySortMode === 'time' ? '依最新排序' : '依名稱排序';
    renderCategoriesView();
  }

  function renderCategoriesView() {
    const container = document.getElementById('categories-list');
    const catMap = {};

    allNotes.forEach(n => {
      const cat = n.category || '未分類';
      if (selectedCategoryFilter !== 'ALL' && cat !== selectedCategoryFilter) return;
      if (!catMap[cat]) catMap[cat] = [];
      catMap[cat].push(n);
    });

    let categories = Object.keys(catMap);

    if (categories.length === 0) {
      container.innerHTML = `<p class="text-center text-gray-400 py-12 font-medium text-base">尚未新增任何主題</p>`;
      return;
    }

    if (categorySortMode === 'name') {
      categories.sort((a, b) => a.localeCompare(b, 'zh-Hant'));
    } else {
      categories.sort((a, b) => {
        const timeA = new Date(catMap[a][0].created_at).getTime();
        const timeB = new Date(catMap[b][0].created_at).getTime();
        return timeB - timeA;
      });
    }

    container.innerHTML = categories.map(cat => {
      const notes = catMap[cat];
      return `
        <div class="space-y-3">
          <div class="flex justify-between items-baseline px-1">
            <h2 class="text-2xl font-medium tracking-tight text-[#111111]">${cat}</h2>
          </div>
          <div class="space-y-3">
            ${notes.map(note => renderPreviewCard(note)).join('')}
          </div>
        </div>
      `;
    }).join('');
  }

  function openCategoryDetail(cat) {
    activeCategory = cat;
    updateHash();
    renderCurrentView();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function renderCategoryDetailView() {
    const container = document.getElementById('category-detail-list');
    const notes = allNotes.filter(n => (n.category || '未分類') === activeCategory);
    container.innerHTML = notes.map(note => renderFullCard(note)).join('');
  }

  function renderPreviewCard(note) {
    const cleanThought = cleanHtmlContent(note.thought);
    return `
      <div onclick="editNote(${note.id})" class="bg-[#F6F6F6] p-5 rounded-2xl cursor-pointer active:scale-98 transition relative space-y-3">
        <div class="flex justify-between items-center">
          <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">${note.book_title}</p>
        </div>
        <div class="text-base font-normal text-[#111111] leading-relaxed pl-1">${note.quote}</div>
        ${cleanThought ? `<div class="text-sm font-normal bg-[#F3E8FF] text-[#6B21A8] p-3.5 rounded-xl leading-relaxed">${cleanThought}</div>` : ''}
      </div>
    `;
  }

  function renderFullCard(note) {
    const cleanThought = cleanHtmlContent(note.thought);
    return `
      <div onclick="editNote(${note.id})" class="bg-[#F6F6F6] p-5 rounded-2xl space-y-3 cursor-pointer active:scale-98 transition relative">
        <div class="flex justify-between items-center">
          <p class="text-xs font-medium text-gray-400 uppercase tracking-wider">${note.category || '未分類'}</p>
        </div>
        <div class="text-base font-normal text-[#111111] leading-relaxed pl-1">${note.quote}</div>
        ${cleanThought ? `<div class="text-sm font-normal bg-[#F3E8FF] text-[#6B21A8] p-3.5 rounded-xl leading-relaxed">${cleanThought}</div>` : ''}
      </div>
    `;
  }

  function resetForm() {
    document.getElementById('note-id').value = '';
    document.getElementById('book_title').value = '';
    document.getElementById('category').value = '';
    document.getElementById('quote').innerHTML = '';
    document.getElementById('thought').innerHTML = '';
    document.getElementById('submit-btn').innerText = "儲存重點";
    document.getElementById('delete-btn').classList.add('hidden');
  }

  function editNote(id) {
    const note = allNotes.find(n => n.id === id);
    if (!note) return;
    document.getElementById('note-id').value = note.id;
    document.getElementById('book_title').value = note.book_title;
    document.getElementById('category').value = note.category || '';
    document.getElementById('quote').innerHTML = note.quote;
    document.getElementById('thought').innerHTML = note.thought || '';

    document.getElementById('submit-btn').innerText = "儲存重點";
    document.getElementById('delete-btn').classList.remove('hidden');
    switchTab('add');
    scrollToTop();
  }

  function preventFocusLoss(e) {
    e.preventDefault();
  }

  function toggleHighlight(targetId) {
    const editor = document.getElementById(targetId);
    const sel = window.getSelection();

    if (!sel.rangeCount || sel.isCollapsed) {
      alert("請先選取要劃線的文字");
      return;
    }

    const range = sel.getRangeAt(0);
    if (!editor.contains(range.commonAncestorContainer)) {
      alert("請選取欄位內的文字");
      return;
    }

    let parentNode = sel.anchorNode.parentNode;
    let markNode = null;

    while (parentNode && parentNode !== editor) {
      if (parentNode.tagName === 'MARK') {
        markNode = parentNode;
        break;
      }
      parentNode = parentNode.parentNode;
    }

    if (markNode) {
      const textNode = document.createTextNode(markNode.textContent);
      markNode.parentNode.replaceChild(textNode, markNode);
    } else {
      const span = document.createElement('mark');
      span.className = 'bg-yellow-200 px-1 rounded text-[#111111]';
      try {
        range.surroundContents(span);
      } catch (e) {
        document.execCommand('hiliteColor', false, '#FEF08A');
      }
    }

    sel.removeAllRanges();
  }

  function startSpeech(targetId) {
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SpeechRecognition) return alert("您的設備不支援語音輸入");
    const recognition = new SpeechRecognition();
    recognition.lang = 'zh-TW';
    recognition.onresult = (e) => {
      const editor = document.getElementById(targetId);
      const text = e.results[0][0].transcript;
      editor.innerHTML = editor.innerHTML ? editor.innerHTML + '<br>' + text : text;
    };
    recognition.start();
  }

  function triggerCamera() {
    document.getElementById('camera-input').click();
  }

  function handleImageUpload(e) {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      loadedImage = new Image();
      loadedImage.onload = () => {
        openDoodleModal();
      };
      loadedImage.src = event.target.result;
    };
    reader.readAsDataURL(file);
  }

  function openDoodleModal() {
    document.getElementById('doodle-modal').classList.remove('hidden');
    setupCanvas();
  }

  function closeDoodleModal() {
    document.getElementById('doodle-modal').classList.add('hidden');
    document.getElementById('camera-input').value = '';
  }

  function resetMaskBounds() {
    maskMinX = Infinity; maskMinY = Infinity; maskMaxX = -Infinity; maskMaxY = -Infinity;
  }

  function setupCanvas() {
    canvas.width = loadedImage.width;
    canvas.height = loadedImage.height;

    ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);

    const rect = canvas.getBoundingClientRect();
    scaleRatio = canvas.width / rect.width;

    resetMaskBounds();
    initCanvasEvents();
  }

  function clearCanvasDoodle() {
    ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
    resetMaskBounds();
  }

  function initCanvasEvents() {
    canvas.onmousedown = startDrawing;
    canvas.onmousemove = draw;
    canvas.onmouseup = stopDrawing;

    canvas.ontouchstart = (e) => startDrawing(e.touches[0]);
    canvas.ontouchmove = (e) => {
      e.preventDefault();
      draw(e.touches[0]);
    };
    canvas.ontouchend = stopDrawing;
  }

  function getCanvasPos(e) {
    const rect = canvas.getBoundingClientRect();
    scaleRatio = canvas.width / rect.width;
    return {
      x: (e.clientX - rect.left) * scaleRatio,
      y: (e.clientY - rect.top) * scaleRatio
    };
  }

  function startDrawing(e) {
    isDrawing = true;
    const pos = getCanvasPos(e);
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y);
    updateMaskBounds(pos.x, pos.y);
  }

  function draw(e) {
    if (!isDrawing) return;
    const pos = getCanvasPos(e);
    const size = document.getElementById('brush-size').value * scaleRatio;

    ctx.lineTo(pos.x, pos.y);
    ctx.strokeStyle = 'rgba(254, 240, 138, 0.55)';
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.stroke();

    updateMaskBounds(pos.x, pos.y, size);
  }

  function stopDrawing() {
    isDrawing = false;
  }

  function updateMaskBounds(x, y, radius = 20) {
    if (x - radius < maskMinX) maskMinX = Math.max(0, x - radius);
    if (y - radius < maskMinY) maskMinY = Math.max(0, y - radius);
    if (x + radius > maskMaxX) maskMaxX = Math.min(canvas.width, x + radius);
    if (y + radius > maskMaxY) maskMaxY = Math.min(canvas.height, y + radius);
  }

  function preprocessCanvas(cropCtx, width, height) {
    const imgData = cropCtx.getImageData(0, 0, width, height);
    const data = imgData.data;

    for (let i = 0; i < data.length; i += 4) {
      let avg = (data[i] + data[i + 1] + data[i + 2]) / 3;
      avg = avg < 140 ? 0 : 255;
      data[i] = avg;
      data[i + 1] = avg;
      data[i + 2] = avg;
    }
    cropCtx.putImageData(imgData, 0, 0);
  }

  function getCroppedCanvasData() {
    if (maskMinX === Infinity) return canvas.toDataURL();

    const width = maskMaxX - maskMinX;
    const height = maskMaxY - maskMinY;

    const cropCanvas = document.createElement('canvas');
    cropCanvas.width = width;
    cropCanvas.height = height;
    const cropCtx = cropCanvas.getContext('2d');

    cropCtx.drawImage(loadedImage, maskMinX, maskMinY, width, height, 0, 0, width, height);
    preprocessCanvas(cropCtx, width, height);

    return cropCanvas.toDataURL('image/png');
  }

  function convertToFullWidthPunctuation(str) {
    return str
      .replace(/,/g, '，')
      .replace(/\./g, '。')
      .replace(/\!/g, '！')
      .replace(/\?/g, '？')
      .replace(/\:/g, '：')
      .replace(/\;/g, '；')
      .replace(/\(/g, '（')
      .replace(/\)/g, '）');
  }

  async function processDoodleCropOCR() {
    const btn = document.getElementById('ocr-btn');
    btn.innerText = '辨識文字中...';
    btn.disabled = true;

    try {
      const croppedImage = getCroppedCanvasData();

      const { data: { text } } = await Tesseract.recognize(
        croppedImage,
        'chi_tra'
      );

      let cleanText = text.replace(/\s+/g, '').trim();
      cleanText = convertToFullWidthPunctuation(cleanText);

      if (cleanText) {
        const editor = document.getElementById('quote');
        editor.innerHTML = editor.innerHTML ? editor.innerHTML + '<br>' + cleanText : cleanText;
        closeDoodleModal();
      } else {
        alert('未能清楚辨識，請確保劃線涵蓋文字');
      }
    } catch (err) {
      console.error(err);
      alert('辨識失敗，請檢查網路連線');
    } finally {
      btn.innerText = '辨識塗黃區域文字';
      btn.disabled = false;
    }
  }

  // 核心修復：表單提交處理
  document.getElementById('note-form').addEventListener('submit', async (e) => {
    e.preventDefault();

    const quoteHtml = cleanHtmlContent(document.getElementById('quote').innerHTML);
    const thoughtHtml = cleanHtmlContent(document.getElementById('thought').innerHTML);

    if (!quoteHtml) {
      alert("請輸入劃線重點！");
      return;
    }

    const btn = document.getElementById('submit-btn');
    btn.innerText = '儲存中...'; 
    btn.disabled = true;

    const noteId = document.getElementById('note-id').value;
    const payload = {
      book_title: document.getElementById('book_title').value,
      category: document.getElementById('category').value || '未分類',
      quote: quoteHtml,
      thought: thoughtHtml // 當內容清空時，這裡會帶入 null 以徹底清除資料庫紀錄
    };

    let error;
    if (noteId) {
      const res = await supabaseClient.from('book_notes').update(payload).eq('id', noteId);
      error = res.error;
    } else {
      const res = await supabaseClient.from('book_notes').insert([payload]);
      error = res.error;
    }

    btn.disabled = false;
    btn.innerText = '儲存重點';

    if (error) {
      alert('儲存失敗：' + error.message);
    } else { 
      // 清除表單並重新拉取最新資料庫內容
      resetForm();
      await fetchNotes();
      switchTab('categories');
    }
  });

  async function handleFormDelete() {
    const noteId = document.getElementById('note-id').value;
    if (noteId && confirm('確定要刪除這條重點嗎？')) {
      const { error } = await supabaseClient.from('book_notes').delete().eq('id', noteId);
      if (!error) {
        resetForm();
        await fetchNotes();
        switchTab('categories');
      } else {
        alert('刪除失敗：' + error.message);
      }
    }
  }

  initAppStateFromHash();
  fetchNotes();
</script>
