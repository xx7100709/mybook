<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>我的讀書重點 App</title>
  <meta name="theme-color" content="#FAF6F0">
  <link rel="manifest" href="./manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF6F0; }
    .pb-safe { padding-bottom: calc(5.5rem + env(safe-area-inset-bottom)); }
  </style>
</head>
<body class="text-[#363028] min-h-screen pb-safe select-none">

  <!-- 頂部 Header -->
  <header class="sticky top-0 bg-[#FAF6F0]/90 backdrop-blur-md z-10 px-5 pt-6 pb-3 border-b border-[#E8DFCFC0]">
    <div class="max-w-md mx-auto flex justify-between items-center">
      <h1 id="page-title" class="text-2xl font-black text-[#2C251E]">📚 我的書庫</h1>
      <span class="text-xs font-bold bg-[#EFE8DC] text-[#63584B] px-3 py-1.5 rounded-full shadow-sm">雲端同步</span>
    </div>
  </header>

  <main class="max-w-md mx-auto px-5 pt-4">
    
    <!-- 頁面 1: 書庫列表 (僅顯示書名) -->
    <div id="view-books" class="space-y-3">
      <div id="books-list" class="space-y-3">
        <p class="text-center text-[#8C8275] py-10">載入中...</p>
      </div>
    </div>

    <!-- 頁面 2: 主題列表 (主題標題 + 前三條預覽) -->
    <div id="view-categories" class="space-y-4 hidden">
      <div id="categories-list" class="space-y-4">
        <p class="text-center text-[#8C8275] py-10">載入中...</p>
      </div>
    </div>

    <!-- 頁面 3: 獨立新增/編輯整頁 -->
    <div id="view-add" class="hidden space-y-5 pb-8">
      <div class="bg-[#FFFDF9] p-6 rounded-3xl border border-[#F0E8DD] shadow-sm">
        <form id="note-form" class="space-y-5">
          <input type="hidden" id="note-id">

          <div>
            <label class="block text-sm font-extrabold text-[#63584B] mb-1.5">書名</label>
            <input type="text" id="book_title" list="book-list" required class="w-full bg-[#FAF6F0] text-[#2C251E] p-4 rounded-2xl border border-[#E8DFCFC0] focus:outline-none focus:border-[#FF7D54] text-base font-bold">
            <datalist id="book-list"></datalist>
          </div>

          <div>
            <label class="block text-sm font-extrabold text-[#63584B] mb-1.5">主題分類</label>
            <input type="text" id="category" list="category-list" required class="w-full bg-[#FAF6F0] text-[#2C251E] p-4 rounded-2xl border border-[#E8DFCFC0] focus:outline-none focus:border-[#FF7D54] text-base font-bold">
            <datalist id="category-list"></datalist>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-sm font-extrabold text-[#63584B]">重點內容</label>
              <button type="button" onclick="startSpeech('quote')" class="text-xs text-[#FF7D54] bg-[#FF7D54]/10 px-3 py-1.5 rounded-xl font-extrabold flex items-center gap-1">
                🎙️ 語音輸入
              </button>
            </div>
            <textarea id="quote" required rows="5" class="w-full bg-[#FAF6F0] text-[#2C251E] p-4 rounded-2xl border border-[#E8DFCFC0] focus:outline-none focus:border-[#FF7D54] text-base leading-relaxed font-medium"></textarea>
          </div>

          <div>
            <div class="flex justify-between items-center mb-1.5">
              <label class="block text-sm font-extrabold text-[#63584B]">個人心得</label>
              <button type="button" onclick="startSpeech('thought')" class="text-xs text-[#FF7D54] bg-[#FF7D54]/10 px-3 py-1.5 rounded-xl font-extrabold flex items-center gap-1">
                🎙️ 語音輸入
              </button>
            </div>
            <textarea id="thought" rows="3" class="w-full bg-[#FAF6F0] text-[#2C251E] p-4 rounded-2xl border border-[#E8DFCFC0] focus:outline-none focus:border-[#FF7D54] text-base leading-relaxed font-medium"></textarea>
          </div>

          <div class="flex gap-3 pt-2">
            <button type="button" onclick="switchTab('books')" class="w-1/3 bg-[#EFE8DC] text-[#63584B] font-extrabold py-4 rounded-2xl text-base">取消</button>
            <button type="submit" id="submit-btn" class="w-2/3 bg-[#FF7D54] text-white font-extrabold py-4 rounded-2xl shadow-lg shadow-[#FF7D54]/30 hover:bg-[#E86C45] text-base">儲存重點</button>
          </div>
        </form>
      </div>
    </div>

  </main>

  <!-- 底部固定 Bar (Bottom Navigation Bar) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-[#FFFDF9]/95 backdrop-blur-md border-t border-[#E8DFCFC0] z-40 px-6 py-2">
    <div class="max-w-md mx-auto flex justify-around items-center relative">
      <button onclick="switchTab('books')" id="nav-books" class="flex flex-col items-center gap-1 text-[#FF7D54] font-bold">
        <span class="text-2xl">📚</span>
        <span class="text-xs">書庫</span>
      </button>

      <!-- 中間凸起的加號大圓紐 -->
      <button onclick="switchTab('add')" id="nav-add" class="flex items-center justify-center w-14 h-14 bg-[#FF7D54] text-white rounded-full shadow-lg shadow-[#FF7D54]/40 -mt-6 border-4 border-[#FAF6F0] active:scale-95 transition-transform">
        <span class="text-3xl font-light mb-1">+</span>
      </button>

      <button onclick="switchTab('categories')" id="nav-categories" class="flex flex-col items-center gap-1 text-[#8C8275] font-bold">
        <span class="text-2xl">🏷️</span>
        <span class="text-xs">主題</span>
      </button>
    </div>
  </nav>

  <script>
    const SUPABASE_URL = 'https://uumglpeoqmkplcnccfrq.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_63y7i9dorGmGi34pP6rCRQ_5xuUo1r_';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allNotes = [];
    let currentTab = 'books';
    let expandedCategories = {};

    async function fetchNotes() {
      const { data, error } = await supabaseClient.from('book_notes').select('*').order('created_at', { ascending: false });
      if (error) return;
      allNotes = data;
      updateDatalists();
      renderCurrentView();
    }

    function updateDatalists() {
      const books = [...new Set(allNotes.map(n => n.book_title).filter(Boolean))];
      const categories = [...new Set(allNotes.map(n => n.category).filter(Boolean))];

      document.getElementById('book-list').innerHTML = books.map(b => `<option value="${b}">`).join('');
      document.getElementById('category-list').innerHTML = categories.map(c => `<option value="${c}">`).join('');
    }

    function switchTab(tab) {
      currentTab = tab;
      const title = document.getElementById('page-title');
      const navBooks = document.getElementById('nav-books');
      const navCat = document.getElementById('nav-categories');

      document.getElementById('view-books').classList.add('hidden');
      document.getElementById('view-categories').classList.add('hidden');
      document.getElementById('view-add').classList.add('hidden');

      navBooks.className = "flex flex-col items-center gap-1 text-[#8C8275] font-bold";
      navCat.className = "flex flex-col items-center gap-1 text-[#8C8275] font-bold";

      if (tab === 'books') {
        title.innerText = "📚 我的書庫";
        navBooks.className = "flex flex-col items-center gap-1 text-[#FF7D54] font-bold";
        document.getElementById('view-books').classList.remove('hidden');
      } else if (tab === 'categories') {
        title.innerText = "🏷️ 主題分類";
        navCat.className = "flex flex-col items-center gap-1 text-[#FF7D54] font-bold";
        document.getElementById('view-categories').classList.remove('hidden');
      } else if (tab === 'add') {
        title.innerText = "✨ 新增劃線重點";
        resetForm();
        document.getElementById('view-add').classList.remove('hidden');
      }
      renderCurrentView();
    }

    function renderCurrentView() {
      if (currentTab === 'books') renderBooksView();
      else if (currentTab === 'categories') renderCategoriesView();
    }

    // 1. 書名列表：僅顯示書名卡片
    function renderBooksView() {
      const container = document.getElementById('books-list');
      const booksMap = {};

      allNotes.forEach(n => {
        const title = n.book_title || '未命名書籍';
        if (!booksMap[title]) booksMap[title] = 0;
        booksMap[title]++;
      });

      const bookNames = Object.keys(booksMap);
      if (bookNames.length === 0) {
        container.innerHTML = `<p class="text-center text-[#8C8275] py-10 bg-[#FFFDF9] rounded-3xl border border-[#F0E8DD]">點擊下方「+」新增第一本劃線重點！</p>`;
        return;
      }

      container.innerHTML = bookNames.map(book => `
        <div class="bg-[#FFFDF9] p-5 rounded-2xl border border-[#F0E8DD] shadow-sm flex justify-between items-center">
          <span class="text-base font-extrabold text-[#2C251E]">📖 ${book}</span>
          <span class="text-xs font-bold bg-[#FAF6F0] text-[#8C8275] px-3 py-1 rounded-full border border-[#E8DFCFC0]">${booksMap[book]} 條重點</span>
        </div>
      `).join('');
    }

    // 2. 主題列表：標題 + 前三條重點預覽
    function renderCategoriesView() {
      const container = document.getElementById('categories-list');
      const catMap = {};

      allNotes.forEach(n => {
        const cat = n.category || '一般';
        if (!catMap[cat]) catMap[cat] = [];
        catMap[cat].push(n);
      });

      const categories = Object.keys(catMap);
      if (categories.length === 0) {
        container.innerHTML = `<p class="text-center text-[#8C8275] py-10 bg-[#FFFDF9] rounded-3xl border border-[#F0E8DD]">尚無主題分類</p>`;
        return;
      }

      container.innerHTML = categories.map(cat => {
        const notes = catMap[cat];
        const isExpanded = expandedCategories[cat];
        const displayNotes = isExpanded ? notes : notes.slice(0, 3);
        const hasMore = notes.length > 3;

        return `
          <div class="bg-[#FFFDF9] p-5 rounded-3xl border border-[#F0E8DD] shadow-sm space-y-4">
            <div class="flex justify-between items-center border-b border-[#F0E8DD] pb-3">
              <h2 class="text-lg font-black text-[#2D5A4C] bg-[#76A895]/15 px-3.5 py-1 rounded-full">🏷️ ${cat}</h2>
              <span class="text-xs font-bold text-[#8C8275]">共 ${notes.length} 條劃線</span>
            </div>

            <div class="space-y-3">
              ${displayNotes.map(note => renderNoteCard(note)).join('')}
            </div>

            ${hasMore ? `
              <button onclick="toggleCategory('${cat}')" class="w-full py-2.5 text-xs font-extrabold text-[#FF7D54] bg-[#FF7D54]/10 rounded-xl hover:bg-[#FF7D54]/20 transition">
                ${isExpanded ? '收起部分重點 ▲' : `查看更多重點 (+${notes.length - 3} 條) ▼`}
              </button>
            ` : ''}
          </div>
        `;
      }).join('');
    }

    function toggleCategory(cat) {
      expandedCategories[cat] = !expandedCategories[cat];
      renderCategoriesView();
    }

    function renderNoteCard(note) {
      const paragraphs = note.quote.split('\n').filter(line => line.trim() !== '');
      const quotesHtml = paragraphs.map(p => `
        <li class="flex items-start gap-2 mb-1.5">
          <span class="text-[#FF7D54] font-black text-base leading-none">•</span>
          <span class="text-base font-medium text-[#2C251E] leading-relaxed">${p}</span>
        </li>
      `).join('');

      return `
        <div class="bg-[#FAF6F0] p-4 rounded-2xl border border-[#E8DFCFC0] space-y-2">
          <p class="text-xs font-extrabold text-[#8C8275]">📖 ${note.book_title}</p>
          <ul class="pl-1">${quotesHtml}</ul>
          ${note.thought ? `<div class="bg-[#FFF8E7] p-2.5 rounded-xl border border-[#FFE8B5] text-xs text-[#6B5218] font-medium"><b>💡 心得：</b> ${note.thought}</div>` : ''}
          <div class="flex justify-end gap-3 pt-1 border-t border-[#E8DFCFC0]/40">
            <button onclick="editNote(${note.id})" class="text-xs text-[#63584B] font-bold">編輯</button>
            <button onclick="deleteNote(${note.id})" class="text-xs text-[#FF7D54] font-bold">刪除</button>
          </div>
        </div>
      `;
    }

    function resetForm() {
      document.getElementById('note-id').value = '';
      document.getElementById('note-form').reset();
      document.getElementById('submit-btn').innerText = "儲存重點";
    }

    function editNote(id) {
      const note = allNotes.find(n => n.id === id);
      if (!note) return;
      document.getElementById('note-id').value = note.id;
      document.getElementById('book_title').value = note.book_title;
      document.getElementById('category').value = note.category || '';
      document.getElementById('quote').value = note.quote;
      document.getElementById('thought').value = note.thought || '';

      document.getElementById('submit-btn').innerText = "更新重點內容";
      switchTab('add');
    }

    function startSpeech(targetId) {
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRecognition) return alert("您的設備不支援語音輸入");
      const recognition = new SpeechRecognition();
      recognition.lang = 'zh-TW';
      recognition.onstart = () => {};
      recognition.onresult = (e) => {
        const val = document.getElementById(targetId).value;
        document.getElementById(targetId).value = val ? val + '\n' + e.results[0][0].transcript : e.results[0][0].transcript;
      };
      recognition.start();
    }

    document.getElementById('note-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submit-btn');
      btn.innerText = '處理中...'; btn.disabled = true;

      const noteId = document.getElementById('note-id').value;
      const payload = {
        book_title: document.getElementById('book_title').value,
        category: document.getElementById('category').value || '未分類',
        quote: document.getElementById('quote').value,
        thought: document.getElementById('thought').value
      };

      let error;
      if (noteId) {
        const res = await supabaseClient.from('book_notes').update(payload).eq('id', noteId);
        error = res.error;
      } else {
        const res = await supabaseClient.from('book_notes').insert([payload]);
        error = res.error;
      }

      if (error) alert('失敗：' + error.message);
      else { 
        fetchNotes();
        switchTab('categories');
      }
      btn.disabled = false;
    });

    async function deleteNote(id) {
      if (confirm('確定要刪除這條重點嗎？')) {
        const { error } = await supabaseClient.from('book_notes').delete().eq('id', id);
        if (!error) fetchNotes();
      }
    }

    fetchNotes();
  </script>
</body>
</html>
